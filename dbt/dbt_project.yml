name: ecom_lakehouse
version: "1.0.0"
config-version: 2
profile: ecom_lakehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # business-date sanity window: anything outside is treated as an invalid date
  min_valid_date: "2020-01-01"
  max_valid_date: "2025-12-31"

models:
  ecom_lakehouse:
    silver:
      +schema: silver
      +materialized: table
      checks:
        +materialized: view
    gold:
      +schema: gold
      +materialized: table
